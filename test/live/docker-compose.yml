# This compose file defines the self-hosted CalDAV servers for the live
# verification runs. Therefore the Radicale, Baikal and Nextcloud
# provider columns need no account anywhere.
#
#     docker compose -f test/live/docker-compose.yml up -d
#     docker compose -f test/live/docker-compose.yml down -v
#
# Radicale answers on http://localhost:5232/. Baikal answers on
# http://localhost:8801/dav.php/. Nextcloud answers on
# http://localhost:8802/remote.php/dav/. All three servers use davenport
# as the user name and davenport as the password. These credentials are
# throwaway credentials, and the project makes them public on purpose.
# test/live/README.md gives the reason for the port choice, the rest of
# the rationale, and the list of the things that depend on this file.

services:
    radicale:
        image: tomsquest/docker-radicale:3.7.6.0
        ports:
            - '127.0.0.1:5232:5232'
        volumes:
            - ./radicale:/config:ro
            - radicale-data:/data
        # The healthcheck of this image requests the root URL, and the
        # healthcheck sends no credentials. The configuration in
        # radicale/ turns authentication on. Radicale therefore answers
        # that request with status 401.
        healthcheck:
            disable: true

    baikal:
        image: ckulka/baikal:0.10.1-nginx
        ports:
            - '127.0.0.1:8801:80'
        volumes:
            - ./baikal/35-davenport-seed.sh:/docker-entrypoint.d/35-davenport-seed.sh:ro
            - baikal-config:/var/www/baikal/config
            - baikal-specific:/var/www/baikal/Specific

    nextcloud:
        image: nextcloud:34.0.2-apache
        ports:
            - '127.0.0.1:8802:80'
        # The Nextcloud image installs the server on first boot. The
        # image installs the server only when the environment supplies
        # the admin user name, the admin password, and a database
        # setting. A SQLite database stays in this container. The stack
        # therefore needs no second container for a database.
        environment:
            SQLITE_DATABASE: nextcloud
            NEXTCLOUD_ADMIN_USER: davenport
            NEXTCLOUD_ADMIN_PASSWORD: davenport
        volumes:
            - nextcloud-html:/var/www/html

volumes:
    radicale-data:
    baikal-config:
    baikal-specific:
    nextcloud-html:
