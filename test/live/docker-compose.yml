# Self-hosted CalDAV servers for live verification runs, so the Radicale,
# Baikal and Nextcloud columns need no account anywhere.
#
#     docker compose -f test/live/docker-compose.yml up -d
#     docker compose -f test/live/docker-compose.yml down -v
#
# Radicale answers on http://localhost:5232/, Baikal on
# http://localhost:8801/dav.php/ and Nextcloud on
# http://localhost:8802/remote.php/dav/, all as davenport/davenport. Those
# credentials are throwaway and public by design. The port choice, the
# rest of the rationale, and what depends on this file are in
# test/live/README.md.

services:
    radicale:
        image: tomsquest/docker-radicale:3.7.6.0
        ports:
            - '127.0.0.1:5232:5232'
        volumes:
            - ./radicale:/config:ro
            - radicale-data:/data
        # The image's healthcheck fetches the root without credentials,
        # which is a 401 once authentication is configured.
        healthcheck:
            disable: true

    baikal:
        image: ckulka/baikal:0.10.1-nginx
        ports:
            - '127.0.0.1:8801:80'
        volumes:
            - ./baikal/35-davenport-seed.sh:/docker-entrypoint.d/35-davenport-seed.sh:ro
            - baikal-config:/var/www/baikal/config
            - baikal-specific:/var/www/baikal/Specific

    nextcloud:
        image: nextcloud:34.0.2-apache
        ports:
            - '127.0.0.1:8802:80'
        # The image installs itself on first boot, but only when the admin
        # pair and a database setting are both present; SQLite is what
        # keeps that database from needing a second container. The trusted
        # domains are the hosts a probe or a browser reaches it by.
        environment:
            SQLITE_DATABASE: nextcloud
            NEXTCLOUD_ADMIN_USER: davenport
            NEXTCLOUD_ADMIN_PASSWORD: davenport
            NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
        volumes:
            - nextcloud-html:/var/www/html

volumes:
    radicale-data:
    baikal-config:
    baikal-specific:
    nextcloud-html:
