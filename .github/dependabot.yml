# Dependabot opens the pull requests that update the dependencies of
# this repository. Each entry below collects every update of one
# ecosystem into one group. Dependabot opens one pull request for each
# group. One review therefore covers a whole batch. Each pull request
# runs the same ci-ok check as any other change.
version: 2
updates:
    # This entry covers package.json and package-lock.json in the root
    # of the repository.
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
      groups:
          npm:
              patterns:
                  - '*'
      # This entry holds typescript at major 5. typescript-eslint does
      # not accept a typescript major above 5 as a peer dependency.
      # npm ci cannot resolve a dependency tree that holds a typescript
      # version above major 5, and the command stops with an error.
      # Every job of the ci-ok check then fails before it starts.
      # Remove this entry when typescript-eslint accepts the new major.
      ignore:
          - dependency-name: typescript
            versions:
                - '>=6'
      commit-message:
          prefix: chore
          prefix-development: chore

    # This entry covers the workflow files in .github/workflows.
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
      groups:
          actions:
              patterns:
                  - '*'
      commit-message:
          prefix: chore
