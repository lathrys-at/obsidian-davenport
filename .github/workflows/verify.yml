name: Verify

# This workflow runs the live verification against real servers. The
# workflow reads the provider secrets. Therefore the workflow has the
# manual dispatch trigger only. A push must not reach the provider
# secrets. A pull request must not reach the provider secrets, and a
# pull request from a fork is the most dangerous case.
on:
    workflow_dispatch:
        inputs:
            target:
                description: What to verify
                type: choice
                required: true
                default: containers
                options:
                    - containers
                    - credentials

permissions:
    contents: read

jobs:
    # This job starts the self-hosted servers. The job then makes sure
    # that each of the three servers answers OPTIONS with a DAV header.
    # The Radicale, Baikal and Nextcloud provider columns need this
    # result before a protocol runner can use these three servers. The
    # job takes no secret. The job runs third-party images, and the job
    # reads nothing that a secret supplies.
    containers:
        if: inputs.target == 'containers'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6

            - name: Start the self-hosted servers
              run: docker compose --file test/live/docker-compose.yml up --detach

            # The user name and the password below are the throwaway
            # pair that the compose file contains. This pair is not a
            # secret.
            - name: Probe the CalDAV roots
              timeout-minutes: 20
              run: |
                  probe() {
                      name=$1
                      url=$2
                      limit=${3:?probe needs an attempt limit}
                      attempt=1
                      while true; do
                          headers=$(curl --silent --max-time 10 --user davenport:davenport \
                              --request OPTIONS --dump-header - --output /dev/null "$url" || true)
                          if printf '%s\n' "$headers" | grep -qi '^dav:'; then
                              echo "$name: $url answers OPTIONS with a DAV header:"
                              printf '%s\n' "$headers" | grep -i '^dav:'
                              return 0
                          fi
                          if [ "$attempt" -ge "$limit" ]; then
                              echo "$name: $url sent no DAV response. Attempt count: $limit" >&2
                              printf '%s\n' "$headers" >&2
                              return 1
                          fi
                          attempt=$((attempt + 1))
                          sleep 2
                      done
                  }

                  # The probe makes one attempt every two seconds. The
                  # first boot of Nextcloud runs an installer. The
                  # Nextcloud container does not listen until that
                  # installer finishes. Therefore the Nextcloud probe
                  # gets the larger attempt limit. This limit gives
                  # headroom for a slow runner. This limit is not a
                  # measured need.
                  failed=0
                  probe radicale http://127.0.0.1:5232/ 60 || failed=1
                  probe baikal http://127.0.0.1:8801/dav.php/ 60 || failed=1
                  probe nextcloud http://127.0.0.1:8802/remote.php/dav/ 150 || failed=1
                  exit "$failed"

            - name: Server logs
              if: failure()
              run: docker compose --file test/live/docker-compose.yml logs

            - name: Stop the self-hosted servers
              if: always()
              run: docker compose --file test/live/docker-compose.yml down --volumes

    # This job reports which providers a dispatch can reach. This job
    # maps the provider secrets, and no other job maps the provider
    # secrets. Each job maps only the variables that the job reads.
    # Therefore a runner for one provider carries the three variables of
    # that provider and no other variables.
    credentials-report:
        if: inputs.target == 'credentials'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            DAVENPORT_TEST_ICLOUD_URL: ${{ secrets.DAVENPORT_TEST_ICLOUD_URL }}
            DAVENPORT_TEST_ICLOUD_USERNAME: ${{ secrets.DAVENPORT_TEST_ICLOUD_USERNAME }}
            DAVENPORT_TEST_ICLOUD_SECRET: ${{ secrets.DAVENPORT_TEST_ICLOUD_SECRET }}
            DAVENPORT_TEST_FASTMAIL_URL: ${{ secrets.DAVENPORT_TEST_FASTMAIL_URL }}
            DAVENPORT_TEST_FASTMAIL_USERNAME: ${{ secrets.DAVENPORT_TEST_FASTMAIL_USERNAME }}
            DAVENPORT_TEST_FASTMAIL_SECRET: ${{ secrets.DAVENPORT_TEST_FASTMAIL_SECRET }}
            DAVENPORT_TEST_NEXTCLOUD_URL: ${{ secrets.DAVENPORT_TEST_NEXTCLOUD_URL }}
            DAVENPORT_TEST_NEXTCLOUD_USERNAME: ${{ secrets.DAVENPORT_TEST_NEXTCLOUD_USERNAME }}
            DAVENPORT_TEST_NEXTCLOUD_SECRET: ${{ secrets.DAVENPORT_TEST_NEXTCLOUD_SECRET }}
            DAVENPORT_TEST_RADICALE_URL: ${{ secrets.DAVENPORT_TEST_RADICALE_URL }}
            DAVENPORT_TEST_RADICALE_USERNAME: ${{ secrets.DAVENPORT_TEST_RADICALE_USERNAME }}
            DAVENPORT_TEST_RADICALE_SECRET: ${{ secrets.DAVENPORT_TEST_RADICALE_SECRET }}
            DAVENPORT_TEST_BAIKAL_URL: ${{ secrets.DAVENPORT_TEST_BAIKAL_URL }}
            DAVENPORT_TEST_BAIKAL_USERNAME: ${{ secrets.DAVENPORT_TEST_BAIKAL_USERNAME }}
            DAVENPORT_TEST_BAIKAL_SECRET: ${{ secrets.DAVENPORT_TEST_BAIKAL_SECRET }}
            DAVENPORT_TEST_GOOGLE_URL: ${{ secrets.DAVENPORT_TEST_GOOGLE_URL }}
            DAVENPORT_TEST_GOOGLE_USERNAME: ${{ secrets.DAVENPORT_TEST_GOOGLE_USERNAME }}
            DAVENPORT_TEST_GOOGLE_SECRET: ${{ secrets.DAVENPORT_TEST_GOOGLE_SECRET }}
        steps:
            # The step prints variable names only. The values of a
            # configured provider stay in the environment, and the step
            # keeps those values out of the log. A variable that holds
            # only whitespace counts as unset. The resolver reads such a
            # variable as unset, and the report must agree with the
            # resolver. A report that counts such a variable as set
            # promises a provider, and the run then skips that provider.
            - name: Report which providers this run can reach
              run: |
                  for provider in ICLOUD FASTMAIL NEXTCLOUD RADICALE BAIKAL GOOGLE; do
                      missing=
                      for part in URL USERNAME SECRET; do
                          name="DAVENPORT_TEST_${provider}_${part}"
                          value=$(printenv "$name" || true)
                          if [ -z "${value//[[:space:]]/}" ]; then
                              missing="$missing $name"
                          fi
                      done
                      if [ -z "$missing" ]; then
                          echo "$provider: configured"
                      else
                          echo "$provider: unavailable. These variables count as unset:$missing"
                      fi
                  done
