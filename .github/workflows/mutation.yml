# This workflow is the mutation lane. StrykerJS makes a small change to the
# source, runs the tests, and asks whether a test fails. A change that
# survives every test marks a line that the tests run and do not check.
# scripts/mutation-ratchet.mjs then compares the score of the run against the
# floor in mutation-baseline.json.
#
# The lane runs once a week, and it runs on request. The lane is not part of
# the required ci-ok check, and no merge waits for it. A run takes far longer
# than the test suite.
name: Mutation

on:
    # The time is UTC. GitHub starts a scheduled workflow on the default
    # branch alone. GitHub also delays a run that starts on a busy minute.
    schedule:
        - cron: '17 4 * * 1'
    workflow_dispatch:

permissions:
    contents: read

# One run of this lane at a time. A run takes a runner for minutes, and a
# second run of the same commit gives the same result.
concurrency:
    group: mutation
    cancel-in-progress: false

# Each uses field below names an action by commit SHA. The comment
# after a SHA gives the release tag of that SHA. Do not replace a SHA
# with a tag. The owner of an action can move a tag to different code.
jobs:
    mutation:
        runs-on: ubuntu-latest
        # A run of this lane takes minutes. The limit stops a run that does
        # not end.
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            # The suite holds tests that read one release of the IANA
            # timezone database, and those tests run nothing when the cache
            # holds no copy of the release. A mutant that only such a test
            # kills would survive the run, and the score would fall. This
            # step gets the release, as the test job of the CI workflow
            # does.
            - run: npm run timezone:download
            - run: npm run mutation

            # The HTML report names every mutant of the run, and it names the
            # line of the source that holds each one. The upload also runs
            # after a mutation run that failed, because the report of a part
            # of a run is still evidence. The report is one file that holds
            # its own data, so a reader needs no other file.
            - if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: mutation-report
                  path: reports/mutation/mutation.html
                  if-no-files-found: warn

            # This step fails when the score is less than the floor. The
            # upload above runs first, so the report of a failed run reaches
            # the artifacts of the run.
            - run: node scripts/mutation-ratchet.mjs
