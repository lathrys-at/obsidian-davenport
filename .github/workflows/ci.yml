name: CI

on:
    push:
        branches: ['**']
    pull_request:

permissions:
    contents: read

# Each uses field below names an action by commit SHA. The comment
# after a SHA gives the release tag of that SHA. Do not replace a SHA
# with a tag. The owner of an action can move a tag to different code.
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run typecheck

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run coverage
            - run: node scripts/coverage-ratchet.mjs
            - run: node scripts/plan-ids.mjs

    # This job runs the steps of the test job on Windows. Windows uses
    # another path separator, another line ending, and a filesystem that
    # ignores letter case. Code that assumes the rules of Linux passes on
    # the job above and fails here.
    test-windows:
        runs-on: windows-latest
        steps:
            # Git for Windows changes the line ending of a text file when it
            # writes the file into the working tree. Tests compare the octets
            # of the fixture files. A changed line ending therefore makes a
            # test fail for a reason that is not in the code. This step stops
            # the change, and the working tree holds the same octets on every
            # platform. The .gitattributes file already covers the ICS
            # corpus, and this step covers every other file.
            - run: git config --global core.autocrlf false
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run coverage
            - run: node scripts/coverage-ratchet.mjs
            - run: node scripts/plan-ids.mjs

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: node scripts/scan-bundle.mjs
            - run: node scripts/bundle-size.mjs
            # This step removes the files of `npm run build`, so it stands
            # after every step that reads those files.
            - run: node scripts/repeat-build.mjs
            - run: npm run probe:build
            - run: node scripts/scan-bundle.mjs tools/frontmatter-probe/dist/main.js

    # This job reads package-lock.json. The job asks the npm registry
    # which of the versions in package-lock.json have a known security
    # defect. The job fails when the registry reports such a defect. The
    # option --package-lock-only tells npm to build the dependency tree
    # from package-lock.json, and the job installs no package.
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version-file: .nvmrc
            - run: npm audit --package-lock-only

    # This job is the single required check that gates merges to main.
    # The job passes only when every needed job has the result success.
    # The needs context lists the needed jobs, and the step reads the
    # full needs context. Therefore a new job in needs is also gated,
    # and the step needs no edit.
    ci-ok:
        needs: [lint, typecheck, test, test-windows, build, audit]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check that every needed job has the result success
              run: |
                  echo '${{ toJSON(needs) }}' | jq -e '(length > 0) and all(.[].result; . == "success")'
