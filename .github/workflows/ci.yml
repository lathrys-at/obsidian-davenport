name: CI

on:
    push:
        branches: ['**']
    pull_request:

permissions:
    contents: read

# Each uses field below names an action by commit SHA. The comment
# after a SHA gives the release tag of that SHA. Do not replace a SHA
# with a tag. The owner of an action can move a tag to different code.
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            # Prettier does not read a markdown file, because
            # .prettierignore holds *.md. This step is the formatting gate
            # of the markdown documents.
            - run: npm run markdown:check

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run typecheck

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            # The generator of the timezone table reads one release of the
            # IANA timezone database. The repository holds the checksum of
            # that release and not the files of it. This step gets the
            # release into a cache outside the tree, and the step fails the
            # job when the bytes do not agree with the checksum. The suite
            # below then holds a test that writes the table from that
            # release and compares it against the table in the tree.
            # Without this step that test states that it has no input and
            # runs nothing. The step and the test read the place of the
            # cache from one module, so the two cannot name different
            # directories.
            #
            # The step reaches the network, as the step above it does. The
            # archive is under half a megabyte. No action holds the archive
            # between two runs. An action that held it would cost more than
            # the download: it would put one more third party in the supply
            # chain of the run.
            #
            # The command gives the status 1 for bytes that do not agree
            # with the pin, and the status 2 for a script that cannot run.
            # A server that does not answer, an answer that is not 200, a
            # name that does not resolve, and an address that does not
            # start with https: are all in the second class. This step
            # therefore runs the command again after the status 2. There
            # are three attempts in total, and the step waits 5 seconds
            # before each attempt after the first one.
            #
            # The status 1 fails the job immediately, and this step does
            # not run the command again after it. A checksum that
            # disagrees is an answer, and a second attempt cannot change
            # that answer.
            - name: Get the pinned timezone release
              shell: bash
              run: |
                  for attempt in 1 2 3; do
                      if [ "$attempt" -gt 1 ]; then
                          sleep 5
                      fi
                      status=0
                      npm run timezone:download || status=$?
                      if [ "$status" -ne 2 ]; then
                          exit "$status"
                      fi
                      echo "the download command could not run. This was attempt ${attempt} of 3."
                  done
                  exit 2
            - run: npm run coverage
            - run: node scripts/coverage-ratchet.mjs
            - run: node scripts/plan-ids.mjs

    # This job runs the steps of the test job on Windows. Windows uses
    # another path separator, another line ending, and a filesystem that
    # ignores letter case. Code that assumes the rules of Linux passes on
    # the job above and fails here.
    test-windows:
        runs-on: windows-latest
        steps:
            # Git for Windows changes the line ending of a text file when it
            # writes the file into the working tree. Tests compare the octets
            # of the fixture files. A changed line ending therefore makes a
            # test fail for a reason that is not in the code. This step stops
            # the change, and the working tree holds the same octets on every
            # platform. The .gitattributes file already covers the ICS
            # corpus, and this step covers every other file.
            - run: git config --global core.autocrlf false
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            # This job runs the same step as the job above, and it reads
            # the status of the command in the same way. The download
            # command writes files and joins paths, and this leg states
            # whether it does so under the rules of Windows too. The shell
            # is bash here, because the default shell of a Windows runner
            # is PowerShell.
            - name: Get the pinned timezone release
              shell: bash
              run: |
                  for attempt in 1 2 3; do
                      if [ "$attempt" -gt 1 ]; then
                          sleep 5
                      fi
                      status=0
                      npm run timezone:download || status=$?
                      if [ "$status" -ne 2 ]; then
                          exit "$status"
                      fi
                      echo "the download command could not run. This was attempt ${attempt} of 3."
                  done
                  exit 2
            - run: npm run coverage
            - run: node scripts/coverage-ratchet.mjs
            - run: node scripts/plan-ids.mjs

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: node scripts/scan-bundle.mjs
            - run: npm run probe:build
            - run: node scripts/scan-bundle.mjs tools/frontmatter-probe/dist/main.js

    # This job reads package-lock.json. The job asks the npm registry
    # which of the versions in package-lock.json have a known security
    # defect. The job fails when the registry reports such a defect. The
    # option --package-lock-only tells npm to build the dependency tree
    # from package-lock.json, and the job installs no package.
    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
            - run: npm audit --package-lock-only

    # This job is the single required check that gates merges to main.
    # The job passes only when every needed job has the result success.
    # The needs context lists the needed jobs, and the step reads the
    # full needs context. Therefore a new job in needs is also gated,
    # and the step needs no edit.
    ci-ok:
        needs: [lint, typecheck, test, test-windows, build, audit]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check that every needed job has the result success
              run: |
                  echo '${{ toJSON(needs) }}' | jq -e '(length > 0) and all(.[].result; . == "success")'
