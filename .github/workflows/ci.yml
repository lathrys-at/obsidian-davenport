name: CI

on:
    push:
        branches: ['**']
    pull_request:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run typecheck

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run coverage

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: node scripts/scan-bundle.mjs
            - run: npm run probe:build
            - run: node scripts/scan-bundle.mjs tools/a11-probe/dist/main.js

    # This job is the single required check that gates merges to main.
    # The job passes only when every job in the needs context has the
    # result success. The step reads the full needs context. Therefore a
    # new job in needs is also gated, and the step needs no edit.
    ci-ok:
        needs: [lint, typecheck, test, build]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Check that every needed job has the result success
              run: |
                  echo '${{ toJSON(needs) }}' | jq -e '(length > 0) and all(.[].result; . == "success")'
