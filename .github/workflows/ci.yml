name: CI

on:
    push:
        branches: ['**']
    pull_request:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check

    typecheck:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run typecheck

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run coverage

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: node scripts/scan-bundle.mjs

    # The single required check gating merges to main. Fails unless every
    # job above succeeded.
    ci-ok:
        needs: [lint, typecheck, test, build]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: All required jobs succeeded
              run: |
                  test "${{ needs.lint.result }}" = "success"
                  test "${{ needs.typecheck.result }}" = "success"
                  test "${{ needs.test.result }}" = "success"
                  test "${{ needs.build.result }}" = "success"
