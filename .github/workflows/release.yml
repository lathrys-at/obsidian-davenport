name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

# Each uses field below names an action by commit SHA. The comment
# after a SHA gives the release tag of that SHA. Do not replace a SHA
# with a tag. The owner of an action can move a tag to different code.
jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            # This step runs the build two times and compares what the two
            # runs wrote. A file whose bytes are not the same in the two runs
            # fails the step, and the release then does not happen. The bytes
            # that a release carries must be a function of the source alone.
            #
            # The place of this step in the job is part of the check. The
            # script removes `main.js` and writes the file again, and it
            # leaves the files of its second run on disk. The steps below
            # therefore read the output of the second run, and the file that
            # the attestation covers is the file that this step compared. A
            # run of this script after the attestation would cover a file
            # that nobody attested.
            - name: Check that the build repeats itself
              run: node scripts/repeat-build.mjs

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
